<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kofvi Book Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500,100;0,9..144,700,100;1,9..144,400,100;1,9..144,500,100&family=Unbounded:wght@600;700&family=Caveat:wght@600;700&family=Inter:wght@300;400;500;600;800&family=Reenie+Beanie&family=DM+Serif+Display&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: theme-coloured side nav (like the Sheet's nav bar) + a cream reading room; the bookcase is the hero of every page. */
:root{
  --page:#FFFBF6; --ink:#1E1E24; --muted:#77707A; --line:#EADFD3; --card:#FFFFFF;
  --theme:#7E9C85; --theme-ink:#FFFFFF;
  --pink:#FDE8EE; --pink2:#F6B6C8; --butter:#FFF5D6; --butter2:#F9D77E; --sky:#E7EFFD; --sky2:#B5CBF5;
  --mint:#E2F4EA; --mint2:#A6DBC2; --lilac:#EFE8FB; --lilac2:#CDBCF2; --peach:#FFEBDD; --peach2:#F8C29E;
  --wall:#F4E6D6; --wall2:#EBD8C4; --wood:#C98F5E; --wood2:#A86E40; --wood3:#8A5631; --woodTop:#E2B184;
  --plate:#E9CF8F; --plateInk:#4B3416; --shadow:rgba(60,35,20,.18); --veil:rgba(30,22,26,.45);
  --display:"Fraunces",Georgia,"Times New Roman",serif; --ui:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#1B1820; --ink:#F3ECE6; --muted:#A79FAA; --line:#3A3340; --card:#25212B;
  --pink:#3D2730; --pink2:#B97A8E; --butter:#3A3322; --butter2:#C7A54F; --sky:#232D40; --sky2:#7C93C4;
  --mint:#1F3329; --mint2:#6FA58B; --lilac:#2C2540; --lilac2:#9A86C9; --peach:#3B2B22; --peach2:#C68F6B;
  --wall:#2A2229; --wall2:#231C22; --wood:#7A5236; --wood2:#5E3E28; --wood3:#452C1C; --woodTop:#94684A;
  --plate:#B89A5A; --plateInk:#24180A; --shadow:rgba(0,0,0,.45); --veil:rgba(8,6,10,.62); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#1B1820; --ink:#F3ECE6; --muted:#A79FAA; --line:#3A3340; --card:#25212B;
  --pink:#3D2730; --pink2:#B97A8E; --butter:#3A3322; --butter2:#C7A54F; --sky:#232D40; --sky2:#7C93C4;
  --mint:#1F3329; --mint2:#6FA58B; --lilac:#2C2540; --lilac2:#9A86C9; --peach:#3B2B22; --peach2:#C68F6B;
  --wall:#2A2229; --wall2:#231C22; --wood:#7A5236; --wood2:#5E3E28; --wood3:#452C1C; --woodTop:#94684A;
  --plate:#B89A5A; --plateInk:#24180A; --shadow:rgba(0,0,0,.45); --veil:rgba(8,6,10,.62); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.form a,.demo a{color:var(--ink)}
body{margin:0}
img{max-width:100%}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--theme);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100%}
/* side nav */
.nav{overflow-y:auto;background:var(--nav,var(--theme));color:var(--navInk,var(--theme-ink));padding-block:22px;padding-inline:16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:2px;padding:4px 10px 18px}
.brand b{font-size:22px;font-weight:900;letter-spacing:.02em;font-family:var(--brandFont,var(--ui))}
.brand span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;color:inherit;text-decoration:none;font-weight:600}
.nav a:hover{background:rgba(255,255,255,.14)}
.nav a.on{background:var(--navOn,rgba(255,255,255,.24));color:var(--navOnInk,inherit);font-weight:800}
.nav a:hover{background:var(--navHover,rgba(255,255,255,.14))}
.nav svg{width:20px;height:20px;flex:none}
.nav .grow{flex:1}
.nav .sec{background:rgba(255,255,255,.12);border:0;border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:center;font-weight:600;text-align:left}
.nav .sec:hover{background:rgba(255,255,255,.22)}
.main{min-width:0;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.demo{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--lilac);border:1px solid var(--lilac2);border-radius:14px;padding:10px 14px;font-size:13px}
.demo b{font-weight:800}
.lnk{background:none;border:0;padding:0;text-decoration:underline;font-weight:700}
/* header */
.hero{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between}
.hero h1{margin:0;font-family:var(--h1font,var(--ui));font-weight:var(--h1w,900);font-size:clamp(28px,4vw,40px);line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.hero h1 em{font-family:var(--display);font-style:italic;font-weight:400;color:var(--muted)}
.hero p{margin:6px 0 0;color:var(--muted);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:var(--ink);color:var(--page)}
.btn:hover{filter:brightness(1.15)}
.btn.soft{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:7px 13px;font-size:13px}
.btn svg{width:18px;height:18px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;border:1px solid transparent}
.tile b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.t-mint{background:var(--mint);border-color:var(--mint2)}.t-sky{background:var(--sky);border-color:var(--sky2)}.t-butter{background:var(--butter);border-color:var(--butter2)}.t-pink{background:var(--pink);border-color:var(--pink2)}
.goalbar{height:8px;border-radius:9px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:6px}
.goalbar i{display:block;height:100%;background:var(--mint2)}
/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--page)}
.lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;min-width:0;flex:0 1 280px}
.search input{border:0;background:none;outline:0;min-width:0;flex:1;font-weight:600}
.search input::placeholder{color:var(--muted);font-style:italic;font-weight:500;opacity:.8}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
/* bookcase */
.case{position:relative;border-radius:20px 20px 10px 10px;padding:26px 22px 8px;background:
  linear-gradient(90deg,var(--frame2,var(--wood3)),var(--frame,var(--wood2)) 14px,transparent 14px,transparent calc(100% - 14px),var(--frame,var(--wood2)) calc(100% - 14px),var(--frame2,var(--wood3))),
  var(--wallArt,repeating-linear-gradient(90deg,var(--wall) 0 46px,var(--wall2) 46px 48px));
  box-shadow:0 18px 40px -18px var(--shadow), inset 0 14px 0 var(--frame,var(--wood2)), inset 0 18px 22px -10px var(--innerShade,rgba(0,0,0,.25))}
.case .ivy{position:absolute;top:2px;right:30px;width:clamp(70px,10vw,120px);pointer-events:none;z-index:3;filter:drop-shadow(0 6px 6px rgba(0,0,0,.15))}
.row{position:relative;display:flex;align-items:flex-end;gap:3px;min-height:150px;padding:0 6px;margin-bottom:34px}
.row::after{content:"";position:absolute;left:-8px;right:-8px;bottom:-18px;height:18px;border-radius:3px;
  background:linear-gradient(var(--woodTop) 0 3px,var(--wood) 3px 60%,var(--wood2));box-shadow:0 10px 14px -8px rgba(0,0,0,.35);z-index:0}
.plate{position:absolute;left:14px;bottom:-15px;z-index:2;background:linear-gradient(var(--plate),color-mix(in srgb,var(--plate) 80%,#000));color:var(--plateInk);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:2px 10px;border-radius:3px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 3px rgba(0,0,0,.25);white-space:nowrap}
.empty-row{align-self:center;color:var(--muted);font-weight:600;font-style:italic;padding:0 8px 40px}
.spine{position:relative;flex:none;border:0;padding:0;border-radius:3px 3px 2px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.12) 18%,rgba(255,255,255,.04) 40%,rgba(0,0,0,.08) 78%,rgba(0,0,0,.3)),var(--c);
  color:var(--sc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),2px 0 3px -1px rgba(0,0,0,.25);
  transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s;z-index:1;transform-origin:50% 100%}
.spine::before,.spine::after{content:"";position:absolute;left:3px;right:3px;height:2px;background:var(--band);opacity:.8}
.spine::before{top:12px}.spine::after{bottom:14px}
.spine .t{writing-mode:vertical-rl;font-weight:800;font-size:12px;letter-spacing:.02em;line-height:1.05;max-height:calc(100% - 52px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:22px}
.spine .a{writing-mode:vertical-rl;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:22px;white-space:nowrap}
.spine.hc .t{font-family:var(--display);font-weight:700;font-size:13px}
.spine:hover,.spine:focus-visible{transform:translateY(-14px) rotate(-2deg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),6px 8px 14px -6px rgba(0,0,0,.45);z-index:2}
.spine.out{visibility:hidden}
.spine .rib{position:absolute;top:-4px;right:6px;width:7px;height:calc(100% + 16px);pointer-events:none}
.spine .rib::before{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:var(--pink2);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.spine .fav{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--band)}
.spine.dnf{opacity:.7}
.decor{flex:none;align-self:flex-end;pointer-events:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.18));position:relative;z-index:1;margin:0 6px}
.lean{transform:rotate(-7deg);transform-origin:0 100%;margin-left:14px}
.lean:hover,.lean:focus-visible{transform:translateY(-14px) rotate(-9deg)}
/* peek card */
.peek{position:fixed;z-index:40;pointer-events:none;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 14px 30px -10px var(--shadow);width:250px;opacity:0;transform:translateY(8px) scale(.96);transition:opacity .18s,transform .22s cubic-bezier(.2,.8,.2,1)}
.peek.show{opacity:1;transform:none}
.peek .pc{width:58px;aspect-ratio:2/3;border-radius:4px;flex:none;background-size:cover;background-position:center;box-shadow:0 4px 8px rgba(0,0,0,.25);transform:perspective(400px) rotateY(70deg);transform-origin:0 50%;transition:transform .45s cubic-bezier(.2,.8,.2,1) .05s}
.peek.show .pc{transform:perspective(400px) rotateY(0)}
.peek b{display:block;font-size:13px;font-weight:800;line-height:1.25}
.peek small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.peek .hint{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800;letter-spacing:.04em;border:1px solid transparent;white-space:nowrap}
.s-Read{background:var(--mint);border-color:var(--mint2)}.s-Reading{background:var(--sky);border-color:var(--sky2)}.s-ToRead{background:var(--butter);border-color:var(--butter2)}.s-DNF{background:var(--peach);border-color:var(--peach2)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sky2);border-radius:9px}
/* open book overlay */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.ov .veil{position:fixed;inset:0;background:var(--veil);backdrop-filter:blur(3px);opacity:0;transition:opacity .35s}
.ov.on .veil{opacity:1}
.sheet{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:34px;align-items:start;max-width:920px;width:100%}
.stage{perspective:1600px;width:260px;height:390px;position:sticky;top:24px}
.b3{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.b3 .f{position:absolute;backface-visibility:hidden}
.b3 .front{inset:0;transform:translateZ(var(--d2));border-radius:2px 6px 6px 2px;background-size:cover;background-position:center;box-shadow:inset 6px 0 8px -4px rgba(0,0,0,.35)}
.b3 .back{inset:0;transform:rotateY(180deg) translateZ(var(--d2));background:var(--c);border-radius:6px 2px 2px 6px}
.b3 .sp{top:0;height:100%;width:var(--d);left:calc(50% - var(--d2));transform:rotateY(-90deg) translateZ(130px);background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.12) 18%,rgba(0,0,0,.08) 78%,rgba(0,0,0,.3)),var(--c);display:flex;align-items:center;justify-content:center;color:var(--sc);overflow:hidden}
.b3 .sp span{writing-mode:vertical-rl;font-weight:800;font-size:calc(12px * var(--k));white-space:nowrap}
.b3 .pg{top:4px;height:calc(100% - 8px);width:calc(var(--d) - 4px);left:calc(50% - var(--d2) + 2px);transform:rotateY(90deg) translateZ(128px);background:repeating-linear-gradient(90deg,#F6EEDF 0 2px,#E6DACA 2px 3px)}
.b3 .tp{left:0;width:100%;height:var(--d);top:calc(50% - var(--d2));transform:rotateX(90deg) translateZ(195px);background:repeating-linear-gradient(0deg,#F6EEDF 0 2px,#E6DACA 2px 3px)}
.b3 .shadowf{position:absolute;left:8%;right:-6%;bottom:-26px;height:26px;background:radial-gradient(closest-side,rgba(0,0,0,.35),transparent);transform:translateZ(-40px);opacity:0;transition:opacity .4s .3s}
.ov.on .shadowf{opacity:1}
.info{background:var(--card);color:var(--ink);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);opacity:0;transform:translateX(24px);transition:opacity .35s .35s,transform .45s cubic-bezier(.2,.8,.2,1) .35s;min-width:0}
.ov.on .info{opacity:1;transform:none}
.ov.closing .info{transition-delay:0s;opacity:0;transform:translateX(24px)}
.ov.closing .veil{transition-delay:.25s}
.info h2{margin:0;font-family:var(--h2font,var(--display));font-weight:700;font-size:clamp(24px,3vw,32px);line-height:1.1;text-wrap:balance}
.info .by{color:var(--muted);font-weight:600}
.x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center}
.x svg{width:18px;height:18px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta .chip{background:var(--page);border-color:var(--line);font-weight:700}
.statusbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.statusbar button{border:1.5px solid var(--line);background:var(--page);border-radius:12px;padding:10px 4px;font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.statusbar button svg{width:18px;height:18px}
.statusbar button.on{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.statusbar .s-Read.on,.statusbar .s-Reading.on,.statusbar .s-ToRead.on,.statusbar .s-DNF.on{border-color:var(--ink)}
.box{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pagerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:600}
.pagerow input{width:84px;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--card);font-weight:800;color:var(--ink)}
.pagerow .pct{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;margin-left:auto}
.rate{display:flex;flex-wrap:wrap;gap:18px}
.stars,.peppers{display:flex;gap:2px}
.stars button,.peppers button{border:0;background:none;padding:2px;font-size:22px;line-height:1;color:var(--line)}
.stars button.on{color:#E5A93A}
.peppers button{filter:grayscale(1);opacity:.35}
.peppers button.on{filter:none;opacity:1}
blockquote{margin:0;font-family:var(--display);font-style:italic;font-size:17px;line-height:1.4;padding-left:14px;border-left:3px solid var(--lilac2)}
.review{margin:0;color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions select{border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--card);font-weight:700;font-size:13px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--peach);border:1px solid var(--peach2);border-radius:12px;padding:10px 12px;font-weight:600}
/* reading page */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px}
.cov{width:100%;aspect-ratio:2/3;border-radius:3px 6px 6px 3px;background-size:cover;background-position:center;box-shadow:inset 4px 0 6px -3px rgba(0,0,0,.35),0 6px 14px -6px rgba(0,0,0,.4);border:0;padding:0;transition:transform .25s}
button.cov:hover{transform:translateY(-4px) rotate(-1.5deg)}
.rcard h3{margin:0;font-weight:800;font-size:16px;line-height:1.25}
.rcard .by{color:var(--muted);font-weight:600;font-size:13px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:4px}
.mini div{background:var(--page);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column}
.mini b{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.mini span{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-h h2{margin:0;font-weight:900;font-size:20px}
.section-h p{margin:0;color:var(--muted);font-weight:500}
/* wishlist ledge */
.ledge{display:flex;flex-wrap:wrap;gap:30px 26px;align-items:flex-end}
.wish{width:150px;display:flex;flex-direction:column;gap:8px;position:relative}
.wish .tag{position:absolute;top:-10px;right:-10px;z-index:2;background:var(--butter);border:1px solid var(--butter2);border-radius:6px;padding:3px 8px;font-weight:900;font-size:12px;transform:rotate(6deg);box-shadow:0 2px 4px rgba(0,0,0,.15);color:var(--ink)}
.wish b{font-weight:800;line-height:1.25}
.wish small{color:var(--muted);font-weight:600}
.wish.bought{opacity:.55}
.prio-High{background:var(--pink);border-color:var(--pink2)}.prio-Medium{background:var(--butter);border-color:var(--butter2)}.prio-Low{background:var(--sky);border-color:var(--sky2)}
.ledgebox{border-radius:20px;padding:30px 24px 0;background:linear-gradient(var(--wall),var(--wall2))}

/* challenge */
.chal{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}

.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:170px}
.months div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.months .stack{display:flex;flex-direction:column-reverse;gap:2px;width:100%;max-width:34px;height:auto}

.months span{font-size:10px;font-weight:800;color:var(--muted)}

.genres{display:flex;flex-direction:column;gap:8px}
.genres div{display:grid;grid-template-columns:120px minmax(0,1fr) 28px;gap:10px;align-items:center;font-weight:600;font-size:13px}

.genres b{text-align:right;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
/* forms */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal .veil{position:fixed;inset:0;background:var(--veil)}
.form{position:relative;background:var(--card);border-radius:22px;padding:24px;max-width:640px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
.form h2{margin:0;font-weight:900;font-size:22px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--page);color:var(--ink);font-weight:700;min-width:0;width:100%}
.fld input::placeholder,.fld textarea::placeholder{color:var(--muted);font-style:italic;font-weight:500;opacity:.75}
.fld.full{grid-column:1/-1}
.coverpick{display:flex;gap:14px;align-items:center}
.coverpick .cov{width:70px;flex:none}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.swatches button.on{box-shadow:0 0 0 2.5px var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--page);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;z-index:80;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tabbar{display:none}
@media (max-width:900px){

  .tiles,.facts{grid-template-columns:repeat(2,minmax(0,1fr))}

}

  .rcard{grid-template-columns:76px minmax(0,1fr)}
  .wish{width:calc(50% - 13px)}
}

.series .section-h{align-items:center}

:root:is([data-look="sticker"],[data-look="kofvi"]) .face{border:1px solid var(--soft);box-shadow:3px 3px 0 var(--softS)}
:root:is([data-look="sticker"],[data-look="kofvi"]) .stk{transform:scale(.8);opacity:.9}
:root:is([data-look="sticker"],[data-look="kofvi"]) .chip{border-color:var(--soft)}
body{font-weight:500}

/* EDITORIAL: white magazine layout, butter-yellow blocks, thin type, handwritten notes, tall striped spines. */
:root[data-look="editorial"]{--page:#FFFFFF;--ink:#262626;--muted:#8C8C8C;--line:#E7E7E7;--card:#FFFFFF;
  --pink:#F4F4F4;--pink2:#E2E2E2;--butter:#F8DE76;--butter2:#F0CD48;--sky:#F4F4F4;--sky2:#F0CD48;--mint:#F4F4F4;--mint2:#F0CD48;--lilac:#F7F7F7;--lilac2:#E2E2E2;--peach:#F4F4F4;--peach2:#E2E2E2;
  --nav:#FFFFFF;--navInk:#5E5E5E;--navOn:#F8DE76;--navOnInk:#262626;--navHover:#F4F4F4;--theme:#F0CD48;
  --shadow:rgba(0,0,0,.12);--veil:rgba(255,255,255,.72);--hand:"Reenie Beanie",cursive;
  --ui:"Inter",system-ui,sans-serif;--h1font:"Inter",system-ui,sans-serif;--h1w:300;--h2font:"Inter",system-ui,sans-serif;--brandFont:"Inter",system-ui,sans-serif;--display:"Inter",system-ui,sans-serif;color-scheme:light}
:root[data-look="editorial"] .nav{border-right:1px solid var(--line)}
:root[data-look="editorial"] .brand b{font-weight:300;letter-spacing:.08em}
:root[data-look="editorial"] .nav a{font-weight:400}
:root[data-look="editorial"] .nav a.on{font-weight:600}
:root[data-look="editorial"] .hero h1{letter-spacing:-.03em;font-size:clamp(32px,4.6vw,52px)}
:root[data-look="editorial"] .hero h1 em{font-family:var(--hand);font-style:normal;color:#262626;font-size:.9em;background:#F8DE76;padding:0 10px}
:root[data-look="editorial"] .tile{border:0;border-radius:14px;background:#F4F4F4}
:root[data-look="editorial"] .tile.t-butter,:root[data-look="editorial"] .tile:first-child{background:#F8DE76}
:root[data-look="editorial"] .tile b{font-weight:500}
:root[data-look="editorial"] .tile span{font-weight:500}
:root[data-look="editorial"] .btn{background:#fff;color:#262626;border:1px solid #CFCFCF;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.06)}
:root[data-look="editorial"] .btn.soft{background:#fff}
:root[data-look="editorial"] .seg button.on{background:#F8DE76;color:#262626}
:root[data-look="editorial"] .info,:root[data-look="editorial"] .form{box-shadow:0 30px 60px -20px rgba(0,0,0,.25);border:1px solid var(--line)}
:root[data-look="editorial"] .info h2{font-weight:300;letter-spacing:-.02em}
:root[data-look="editorial"] .case{background:#FAFAFA;box-shadow:none;border-radius:18px}
:root[data-look="editorial"] .row::after{background:#262626;height:2px;bottom:-4px;left:0;right:0;box-shadow:none;border-radius:0}
:root[data-look="editorial"] .row{margin-bottom:46px}
:root[data-look="editorial"] .plate{background:none;box-shadow:none;color:#262626;font-family:var(--hand);font-size:22px;letter-spacing:0;text-transform:none;font-weight:400;bottom:-34px;left:0;padding:0}
:root[data-look="editorial"] .spine:not(.face){border-radius:0;background:var(--c);box-shadow:none;outline:1px solid rgba(0,0,0,.07)}
:root[data-look="editorial"] .spine::before,:root[data-look="editorial"] .spine::after{display:none}
:root[data-look="editorial"] .spine .t{font-family:"Inter",sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.14em}
:root[data-look="editorial"] .face{border-radius:4px;box-shadow:0 10px 20px -10px rgba(0,0,0,.4)}
:root[data-look="editorial"] .decor{filter:grayscale(.15) drop-shadow(0 4px 3px rgba(0,0,0,.1))}
/* SHELFIE: sky-blue gradient wall, floating light-oak shelves with long shadows, chunky 3D spines + face-out covers. */
:root[data-look="shelfie"]{--page:#6FA6EA;--ink:#1D2B44;--muted:#5B6B86;--line:#D5E2F5;--card:#FFFFFF;
  --pink:#FFFFFF;--pink2:#FFFFFF;--butter:#FFFFFF;--butter2:#FFFFFF;--sky:#EAF2FD;--sky2:#5B95E0;--mint:#FFFFFF;--mint2:#5B95E0;--lilac:rgba(255,255,255,.2);--lilac2:rgba(255,255,255,.45);--peach:#FFFFFF;--peach2:#FFFFFF;
  --nav:rgba(255,255,255,.16);--navInk:#FFFFFF;--navOn:#FFFFFF;--navOnInk:#1D2B44;--navHover:rgba(255,255,255,.18);--theme:#2F6BC2;
  --shadow:rgba(20,50,110,.35);--veil:rgba(20,45,95,.55);
  --h1font:"DM Serif Display",Georgia,serif;--h1w:400;--h2font:"DM Serif Display",Georgia,serif;--brandFont:"DM Serif Display",Georgia,serif;--display:"DM Serif Display",Georgia,serif;color-scheme:light}
:root[data-look="shelfie"] body{background:linear-gradient(160deg,#4F94E4 0%,#6FA9EC 45%,#8DA8E8 100%) fixed}
:root[data-look="shelfie"] .nav{backdrop-filter:blur(10px);border-right:1px solid rgba(255,255,255,.25)}
:root[data-look="shelfie"] .demo{color:#fff}
:root[data-look="shelfie"] .demo .lbl{color:rgba(255,255,255,.85)}
:root[data-look="shelfie"] .hero,:root[data-look="shelfie"] .hero p,:root[data-look="shelfie"] .tools>div>.lbl,:root[data-look="shelfie"] .section-h,:root[data-look="shelfie"] .section-h p{color:#fff}
:root[data-look="shelfie"] .hero h1{font-size:clamp(34px,5vw,58px);letter-spacing:-.01em}
:root[data-look="shelfie"] .hero h1 em{font-family:var(--h1font);font-style:normal;color:rgba(255,255,255,.7)}
:root[data-look="shelfie"] .tile{border:0;border-radius:18px;box-shadow:0 14px 30px -14px rgba(20,50,110,.5)}
:root[data-look="shelfie"] .btn{background:#fff;color:#1D2B44}
:root[data-look="shelfie"] .btn.soft{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.5)}
:root[data-look="shelfie"] .info .btn{background:#1D2B44;color:#fff}:root[data-look="shelfie"] .info .btn.soft,:root[data-look="shelfie"] .form .btn.soft{background:#fff;color:#1D2B44;border-color:var(--line)}
:root[data-look="shelfie"] .form .btn{background:#1D2B44;color:#fff}
:root[data-look="shelfie"] .seg{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4)}
:root[data-look="shelfie"] .seg button{color:#fff}
:root[data-look="shelfie"] .seg button.on{background:#fff;color:#1D2B44}
:root[data-look="shelfie"] .case{background:none;box-shadow:none;padding:30px 4% 30px;overflow:hidden}
:root[data-look="shelfie"] .row{margin-bottom:70px}
:root[data-look="shelfie"] .row::after{left:-3%;right:-3%;height:24px;bottom:-24px;border-radius:2px;background:linear-gradient(#F3E2C6 0 5px,#E4CBA4 5px,#D8BC92);box-shadow:0 2px 0 #C7A87C}
:root[data-look="shelfie"] .row::before{content:"";position:absolute;left:4%;right:-6%;bottom:-74px;height:52px;background:linear-gradient(rgba(22,60,130,.38),rgba(22,60,130,0));transform:skewX(42deg);transform-origin:0 0;z-index:0;pointer-events:none}
:root[data-look="shelfie"] .plate{background:#fff;color:#1D2B44;bottom:-20px;border-radius:999px;box-shadow:0 4px 10px rgba(20,50,110,.3)}
:root[data-look="shelfie"] .spine{border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),5px 0 0 -1px color-mix(in srgb,var(--c) 70%,#000),8px 6px 14px -6px rgba(10,30,70,.5)}
:root[data-look="shelfie"] .spine::before,:root[data-look="shelfie"] .spine::after{display:none}
:root[data-look="shelfie"] .spine .t{font-family:"Inter",sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
:root[data-look="shelfie"] .face{box-shadow:inset -4px 0 0 rgba(255,255,255,.6),6px 0 0 -1px #EFE6D6,10px 10px 18px -8px rgba(10,30,70,.55)}
:root[data-look="shelfie"] .ledgebox{background:rgba(255,255,255,.18)}
:root[data-look="shelfie"] .wish b,:root[data-look="shelfie"] .wish small{color:#fff}
/* face-out cover on the shelf */
.spine.face{background-size:cover;background-position:center;border-radius:3px 6px 6px 3px;box-shadow:inset 4px 0 6px -3px rgba(0,0,0,.35),0 8px 16px -8px rgba(0,0,0,.45);margin:0 6px}
.spine.face::before,.spine.face::after{display:none}
.spine.face .rib{right:12px}
.looks{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.looks button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:700;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.looks button i{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.looks button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>

function groups(list){const a=S.view.arrange;let keys,key;

  else if(a==="genre"){key=b=>b.genre||"Other";keys=[...new Set(list.map(key))].sort()}
  else{key=b=>b.author||"Unknown";keys=[...new Set(list.map(key))].sort()}
  const label={"Reading":"Currently reading","To Read":"Up next","Read":"Finished","Did Not Finish":"Did not finish"};
  return keys.map(k=>({k,name:label[k]||k,books:list.filter(b=>key(b)===k)})).filter(g=>g.books.length||(a==="status"&&g.k!=="Did Not Finish"&&!S.view.q))}

function stickers(){if(LOOK()==="kofvi")return`<span class="stk" style="top:-20px;left:-16px">${CUP}</span><span class="stk" style="top:-12px;right:36%;transform:rotate(30deg)">${BEAN}</span><span class="stk" style="top:8px;right:24px"><span style="display:inline-block;font-family:'DM Mono',monospace;font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2A1C15;background:#CAD5F0;border:3px solid #2A1C15;border-radius:999px;padding:5px 12px;transform:rotate(-4deg);box-shadow:3px 3px 0 #2A1C15">Read it over coffee</span></span>`;return`<span class="stk" style="top:-18px;left:-14px">${STK.heart}</span><span class="stk" style="top:38%;right:-14px">${STK.pstar}</span><span class="stk" style="top:6px;right:24px">${STK.tag("my reading corner ★")}</span>`}

  const list=S.books.filter(b=>!q||(b.title+" "+b.author+" "+b.series).toLowerCase().includes(q));

   <div style="display:flex;gap:6px;align-items:center;margin-top:6px"><span class="chip ${SCLS(b.status)}">${SHORT[b.status]}</span>${b.status==="Reading"?`<span style="font-weight:800;font-size:12px">${pct(b)}%</span>`:b.rating?`<span style="color:#E5A93A;font-size:12px">${"★".repeat(Math.round(b.rating))}</span>`:""}</div>
   <div class="hint">Click to open</div></div>`;

   <div class="stage"><div class="b3" id="b3" style="--c:${c};--sc:${spineInk(c)}">
     <div class="f back"></div><div class="f pg"></div><div class="f tp"></div><div class="f sp"><span>${esc(b.title)}</span></div>
     ${coverUrl(b)?`<div class="f front" style="background-image:url('${coverUrl(b)}')"></div>`:coverHTML(b,"f front")}<div class="shadowf"></div></div></div>
   <div class="info" id="info"></div></div></div>`;
  drawInfo(b);

    stage.querySelector(".sp").style.transform=`rotateY(-90deg) translateZ(${W/2}px)`;stage.querySelector(".pg").style.transform=`rotateY(90deg) translateZ(${W/2-2}px)`;stage.querySelector(".tp").style.transform=`rotateX(90deg) translateZ(${H/2}px)`;
    const dx=(r.left+r.width/2)-(sr.left+W/2),dy=(r.top+r.height/2)-(sr.top+H/2);

    stage.querySelector(".sp").style.transform=`rotateY(-90deg) translateZ(${W/2}px)`;stage.querySelector(".pg").style.transform=`rotateY(90deg) translateZ(${W/2-2}px)`;stage.querySelector(".tp").style.transform=`rotateX(90deg) translateZ(${H/2}px)`;
    if(srcEl){const r=srcEl.getBoundingClientRect(),s=r.width/W;from=`translate(${(r.left+r.width/2)-(sr.left+W/2)}px,${(r.top+r.height/2)-(sr.top+H/2)}px) scale(${s}) rotateY(0deg)`}}

function closeBook(){if(!openState)return;const ov=$("#layer .ov");if(!ov)return;const {src,from,b3}=openState;openState=null;
  ov.classList.add("closing");ov.classList.remove("on");const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

const ICON={"To Read":'<path d="M6 3h12v18l-6-4-6 4z"/>',"Reading":'<path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2zM22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/>',"Read":'<path d="M20 6 9 17l-5-5"/>',"Did Not Finish":'<path d="M6 6l12 12M18 6 6 18"/>'};

  <div class="rate"><div><div class="k">My rating</div><div class="stars" role="group" aria-label="Rating">${[1,2,3,4,5].map(n=>`<button type="button" data-rate="${n}" class="${b.rating>=n-.25?"on":""}" aria-label="${n} star${n>1?"s":""}">★</button>`).join("")}</div></div>

  `<div class="actions"><button class="btn small" type="button" data-act="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Edit details</button>

   <button class="btn small soft" type="button" data-act="del">Remove</button></div>`}`;
  const pg=$("#pg");if(pg)pg.addEventListener("change",()=>{let v=Math.max(0,Math.min(+b.pages||99999,+pg.value||0));b.page=v;if(b.pages&&v>=b.pages&&b.status==="Reading"){setStatus(b,"Read");return}save();drawInfo(b);toast("Saved: page "+v)});
  const mv=$("#mv");if(mv)mv.addEventListener("change",()=>{if(mv.value==="__new"){drawNewShelf(b);return}if(mv.value){b.shelf=mv.value;save();drawInfo(b);toast("Moved to "+b.shelf)}})}
function drawNewShelf(b){const a=$("#info .actions");a.innerHTML=`<div class="fld" style="flex:1"><label for="ns">New shelf name</label><input id="ns" placeholder="e.g. Summer 2027"></div><button class="btn small" type="button" id="nsok">Create and move</button><button class="btn small soft" type="button" data-act="redraw">Cancel</button>`;
  $("#ns").focus();const ok=()=>{const v=$("#ns").value.trim();if(!v)return;b.shelf=v;save();drawInfo(b);toast("Moved to "+v)};$("#nsok").onclick=ok;$("#ns").addEventListener("keydown",e=>{if(e.key==="Enter")ok()})}
function paceText(b){const d=Math.max(1,days(parseD(b.start),TODAY)+1),per=(+b.page||0)/d;if(!per)return`day ${d}`;const left=Math.max(0,(b.pages||0)-(b.page||0)),eta=new Date(TODAY.getTime()+Math.ceil(left/per)*864e5);return`${Math.round(per)} pages a day · done around ${eta.toLocaleDateString("en-US",{month:"short",day:"numeric"})}`}
function setStatus(b,s){const was=b.status;b.status=s;

  else if(s==="Reading")toast("Happy reading! It's on your Currently reading shelf.");
  else toast("Moved to "+(s==="To Read"?"Up next":SHORT[s]))}

/* ---------- now reading ---------- */

  <section class="cards">${R.length?R.map(b=>`<article class="rcard">${coverHTML(b,"cov","button",`type="button" data-open="${b.id}"`)}<div style="display:flex;flex-direction:column;gap:8px;min-width:0">

  <div class="section-h"><h2>Up next</h2><p>${N.length} book${N.length===1?"":"s"} waiting</p></div>

  <div class="section-h"><h2>Just finished</h2></div>
  <section class="ledge">${L.map(b=>`<div class="wish" style="width:110px">${coverHTML(b,"cov","button",`type="button" data-open="${b.id}"`)}<small>${fmtD(b.finish)}</small></div>`).join("")}</section>`;
  document.querySelectorAll("[data-page]").forEach(i=>i.addEventListener("change",()=>{const b=S.books.find(x=>x.id===i.dataset.page);b.page=Math.max(0,Math.min(b.pages||99999,+i.value||0));save();
    if(b.pages&&b.page>=b.pages){b.status="Read";b.finish=iso(TODAY);save();toast("You reached the last page! Marked as read.")}else toast("Saved: page "+b.page);refresh()}))}
function etaShort(b){const d=Math.max(1,days(parseD(b.start)||TODAY,TODAY)+1),per=(+b.page||0)/d;if(!per)return"–";const left=Math.max(0,(b.pages||0)-(b.page||0));return new Date(TODAY.getTime()+Math.ceil(left/per)*864e5).toLocaleDateString("en-US",{month:"short",day:"numeric"})}

/* ---------- challenge ---------- */

/* ---------- calendar ---------- */
function vCalendar(){const ym=S.view.cal||iso(TODAY).slice(0,7);const [Y,M]=ym.split("-").map(Number);const first=new Date(Y,M-1,1),dim=new Date(Y,M,0).getDate();

  <section class="panel" style="padding:12px"><div class="calwrap"><div class="cal">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dh">${d}</div>`).join("")}${cells}</div></div></section>`}

/* ---------- my books table ---------- */
function vBooks(){const so=S.view.ts||"title",dir=S.view.td||1,q=(S.view.tq||"").toLowerCase();
  const cols=[["title","Title"],["author","Author"],["series","Series"],["genre","Genre"],["format","Format"],["status","Status"],["pages","Pages"],["progress","Progress"],["rating","Rating"],["start","Started"],["finish","Finished"],["price","Price"]];

  const rt=t.closest("[data-rate]");if(rt&&openState){const b=S.books.find(x=>x.id===openState.id),n=+rt.dataset.rate;b.rating=b.rating===n?0:n;save();drawInfo(b);return}
  const sp=t.closest("[data-spice]");if(sp&&openState){const b=S.books.find(x=>x.id===openState.id),n=+sp.dataset.spice;b.spice=b.spice===n?0:n;save();drawInfo(b);return}
  const fin=t.closest("[data-fin]");if(fin){const b=S.books.find(x=>x.id===fin.dataset.fin);b.status="Read";b.page=b.pages;b.finish=iso(TODAY);save();toast(`Finished! That's ${readThisYear().length} of ${S.settings.goal} for ${S.settings.year}.`);refresh();return}
  const sb=t.closest("[data-startb]");if(sb){const b=S.books.find(x=>x.id===sb.dataset.startb);b.status="Reading";b.start=iso(TODAY);b.page=0;save();toast("Happy reading!");refresh();return}
  const bo=t.closest("[data-bought]");if(bo){const w=S.wish.find(x=>x.id===bo.dataset.bought);w.bought=true;S.books.push({id:"b"+Date.now(),title:w.title,author:w.author,series:"",num:"",genre:w.genre,format:w.format,status:"To Read",pages:0,page:0,start:"",finish:"",rating:0,spice:0,price:w.price,shelf:"",quote:"",review:"",cover:w.cover,color:w.color});save();toast(`“${w.title}” is now on your shelf, in Up next.`);refresh();return}
  const a=t.closest("[data-act]");if(!a)return;const act=a.dataset.act,b=openState&&S.books.find(x=>x.id===openState.id);
  if(act==="close")closeBook();
  else if(act==="add")editBook(null);
  else if(act==="addwish")editWish();

  else if(act==="del"&&b)drawInfo(b,true);

  else if(act==="del-yes"&&b){S.books=S.books.filter(x=>x!==b);save();const src=openState.src;openState=null;$("#layer").innerHTML="";toast("Removed “"+b.title+"”");refresh()}

/* ---------- cloud: Supabase sign-in, access code, sync (same pattern as the Content Planner) ---------- */
let sb=null,user=null,granted=false,pulling=false,pushTimer=null;
function setSync(st){const a=$("#acct");if(!a||!user)return;const t={saving:"Saving…",synced:"Saved to your account",offline:"Offline. Saved on this device",error:"Couldn't save. Retrying soon"}[st]||"";a.hidden=false;a.innerHTML=`<span class="dot ${st}"></span><span>${t}</span><small>${esc(user.email||"")}</small><button type="button" class="lnk" data-act="signout">Sign out</button>`}
function cloudPush(){if(!sb||!user||pulling||!granted)return;setSync("saving");clearTimeout(pushTimer);
  pushTimer=setTimeout(async()=>{try{const t=new Date().toISOString();S._t=Date.parse(t);S._uid=user.id;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    const {error}=await sb.from("planners").upsert({user_id:user.id,product:PRODUCT,data:S,updated_at:t},{onConflict:"user_id,product"});
    setSync(error?(navigator.onLine?"error":"offline"):"synced");if(error&&navigator.onLine)setTimeout(cloudPush,15000)}catch(e){setSync(navigator.onLine?"error":"offline")}pushTimer=null},1200)}
async function cloudPull(){if(!sb||!user||!granted)return;pulling=true;
  try{const {data,error}=await sb.from("planners").select("data,updated_at").eq("user_id",user.id).eq("product",PRODUCT).maybeSingle();
    if(error){setSync(navigator.onLine?"error":"offline");return}
    if(data&&data.data&&data.data.books){const rt=Date.parse(data.updated_at);if(S._uid!==user.id||!(S._t>rt)){S=data.data;S._t=rt;S._uid=user.id}else{pulling=false;cloudPush()}}
    else{if(S._uid&&S._uid!==user.id)S=blank();S._uid=user.id;pulling=false;cloudPush()}
    S.view=S.view||{arrange:"status",q:""};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}setSync("synced")}finally{pulling=false}}
function gate(html){const g=$("#gate");g.innerHTML=`<div class="modal"><div class="veil"></div><div class="form" style="max-width:520px">${html}</div></div>`;g.hidden=false}
function showLogin(msg){gate(`<span class="k">Kofvi planners</span><h2>Sign in to your Book Tracker</h2>
  <p style="margin:0;color:var(--muted)">Your library is saved to your own private account, so it's the same on your phone and your computer. No password: we email you a sign-in link.</p>
  <form id="loginForm" style="display:flex;flex-direction:column;gap:12px"><div class="fld"><label for="lEmail">Email</label><input id="lEmail" type="email" required autocomplete="email" placeholder="you@example.com"></div>
  <div class="fld"><label for="lCode">Access code (first time only, it's in your Etsy download)</label><input id="lCode" autocomplete="off" placeholder="e.g. KOFVI-BOOKS-XXXX"></div>
  <button class="btn" type="submit" id="lBtn">Email me a sign-in link</button><div id="lMsg">${msg?`<div class="confirm">${esc(msg)}</div>`:""}</div></form>
  <p style="margin:0;font-size:13px;color:var(--muted)">Just looking? <a href="?demo">Try the demo</a>, no sign-in needed. · <a href="/planner/">All Kofvi planners</a></p>`)}
async function doLogin(){const email=$("#lEmail").value.trim(),code=$("#lCode").value.trim(),out=$("#lMsg"),btn=$("#lBtn");if(!email)return;btn.disabled=true;btn.textContent="Sending…";
  const fail=t=>{out.innerHTML=`<div class="confirm">${esc(t)}</div>`;btn.disabled=false;btn.textContent="Email me a sign-in link"};
  try{if(code){const {data:prod,error}=await sb.rpc("code_product",{p_code:code});if(error)return fail("We couldn't check the code. Check your connection and try again.");if(!prod)return fail("That access code isn't right. Copy it exactly as it appears in your Etsy download.");if(prod!==PRODUCT)return fail("This code is for a different Kofvi planner. Open that planner from kofvi.com/planner.");try{localStorage.setItem("kofvi-pending-code",code)}catch(e){}}
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:!!code,data:code?{access_code:code}:undefined}});
    if(error){if(/signups not allowed|not found|otp_disabled/i.test(error.message))return fail("We don't have an account for this email yet. If you're new, add the access code from your Etsy download.");if(/rate|seconds/i.test(error.message))return fail("Please wait a minute before asking for another link.");return fail(error.message)}
    out.innerHTML=`<div class="box" style="background:var(--mint)">Check your inbox. We sent a sign-in link to <b>${esc(email)}</b>. Open it on this device.</div>`;btn.textContent="Link sent"}catch(e){fail("Something went wrong. Check your connection and try again.")}}
async function hasAccess(){try{const pc=localStorage.getItem("kofvi-pending-code");if(pc){await sb.rpc("redeem_access_code",{p_code:pc});localStorage.removeItem("kofvi-pending-code")}}catch(e){}
  const {data,error}=await sb.from("user_products").select("product").eq("user_id",user.id).eq("product",PRODUCT).maybeSingle();if(error)return null;return !!data}
function showUnlock(msg){gate(`<span class="k">Kofvi planners</span><h2>Unlock the Book Tracker</h2><p style="margin:0;color:var(--muted)">You're signed in as <b>${esc(user.email||"")}</b>, but the Book Tracker isn't on your account yet. Enter the access code from your Etsy download.</p>
  <form id="unlockForm" style="display:flex;flex-direction:column;gap:12px"><div class="fld"><label for="uCode">Access code</label><input id="uCode" required autocomplete="off" placeholder="e.g. KOFVI-BOOKS-XXXX"></div><button class="btn" type="submit" id="uBtn">Unlock</button>${msg?`<div class="confirm">${esc(msg)}</div>`:""}</form>
  <p style="margin:0;font-size:13px;color:var(--muted)"><a href="?demo">Try the demo</a> · <a href="/planner/">All Kofvi planners</a> · <button type="button" class="lnk" data-act="signout">Sign out</button></p>`)}
async function doUnlock(){const code=$("#uCode").value.trim(),btn=$("#uBtn");if(!code)return;btn.disabled=true;btn.textContent="Checking…";
  const {data:prod}=await sb.rpc("code_product",{p_code:code});if(prod&&prod!==PRODUCT)return showUnlock("This code is for a different Kofvi planner. Open that planner from kofvi.com/planner.");
  const {data,error}=await sb.rpc("redeem_access_code",{p_code:code});if(error||data!==PRODUCT)return showUnlock(error?"We couldn't check the code. Check your connection and try again.":"That access code isn't right. Copy it exactly as it appears in your Etsy download.");await openPlanner()}
async function openPlanner(){const ok=await hasAccess();if(ok===null){showLogin("We couldn't reach your account. Check your connection and refresh.");return}
  if(!ok){granted=false;showUnlock();return}granted=true;await cloudPull();if(/[?&]code=/.test(location.search))history.replaceState(null,"",location.pathname+location.hash);
  $("#gate").hidden=true;$("#gate").innerHTML="";applyTheme();route();setSync("synced")}
async function cloudBoot(){sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
  const {data:{session}}=await sb.auth.getSession();
  if(!session)showLogin(/error_description=([^&]+)/.test(location.href)?decodeURIComponent(RegExp.$1.replace(/\+/g," ")):"");else{user=session.user;await openPlanner()}
  sb.auth.onAuthStateChange((ev,ses)=>{if(ev==="SIGNED_IN"&&ses&&(!user||user.id!==ses.user.id)){user=ses.user;openPlanner()}if(ev==="SIGNED_OUT"){user=null;granted=false;$("#acct").hidden=true;showLogin()}});
  addEventListener("focus",()=>{if(user&&granted&&!pushTimer&&!openState&&!$("#layer .modal"))cloudPull().then(refresh)});addEventListener("online",()=>{if(user)cloudPush()})}
document.addEventListener("submit",e=>{if(e.target.id==="loginForm"){e.preventDefault();doLogin()}else if(e.target.id==="unlockForm"){e.preventDefault();doUnlock()}});

applyTheme();route();
if(!DEMO){gate('<p style="margin:0;font-weight:700">Opening your Book Tracker…</p>');cloudBoot()}
</script>
