PAGES["well:habits"]=()=>{const dn=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],ti=(TODAY.getDay()+6)%7;
 const streak=h=>{let n=0;for(let i=ti;i>=0;i--){if(h.d[i])n++;else if(i!==ti)break}return n};
 const tot=S.habits.reduce((s,h)=>s+h.d.filter(Boolean).length,0),max=S.habits.length*7;
 return `<div class="grid"><div class="card c4 power"><p class="kick">This week</p><div class="row" style="gap:16px;margin:10px 0">${ringSVG(tot/max,"#7FE0AE",104,"habits")}<div><div class="mid" style="color:#fff">${tot}/${max}</div><p class="kick">ticks</p></div></div><p style="color:#c9ccd5;margin:0">Missed a day? Streaks here forgive one gap. Just tick the next one.</p></div>
 <div class="card c8">${hd("Tap a day to tick it","Daily habits",addBtn("habits","New habit"))}<div class="hbgrid">${S.habits.map((h,hi)=>`<div class="hrow"><div class="hname"><span style="background:${h.c}"></span><b>${esc(h.n)}</b>${edBtn("habits",hi)}</div><div class="hdays">${h.d.map((v,di)=>`<button class="hbig ${v?"on":""} ${di===ti?"td":""}" style="--c:${h.c}" data-act="habit:${hi}:${di}" aria-pressed="${!!v}" aria-label="${esc(h.n)} ${dn[di]}" data-tip="${esc(h.n)} · ${dn[di]}: ${v?"done":"not yet"}"><small>${dn[di][0]}</small>${v?I("check",16,3):""}</button>`).join("")}</div><span class="streak">🔥 ${streak(h)}</span></div>`).join("")}</div></div></div>`};

PAGES["goals:goals"]=()=>{const areas=["All",...new Set(S.x.goals.map(g=>g.area||"Life"))],f=S.x.gArea||"All",AC={Career:"#7B3FE4",Fitness:"#14A39A",Money:"#20B26B",Learning:"#F2850F",Life:"#19C3EE",Home:"#D44B8A"};
 return `<div class="grid"><div class="card c12 flat">${hd("Career, fitness, money, learning and life","All my goals",addBtn("goals","New goal"))}<div class="cfilters">${areas.map(a=>`<button data-act="garea:${a}" aria-pressed="${f===a}" style="--c:${AC[a]||"var(--ink)"}"><i></i>${a}${a==="All"?"":" · "+S.x.goals.filter(g=>(g.area||"Life")===a).length}</button>`).join("")}</div></div>
 ${S.x.goals.map((g,i)=>({g,i})).filter(({g})=>f==="All"||(g.area||"Life")===f).map(({g,i})=>{const dn=g.steps.filter(z=>z.d).length,pc=g.steps.length?dn/g.steps.length:0,nx=g.steps.find(z=>!z.d);
 return `<div class="card c6">${edBtn("goals",i)}<span class="tag" style="align-self:flex-start;background:${AC[g.area]||g.c}22;color:${AC[g.area]||g.c};margin-bottom:8px">${esc(g.area||"Life")}</span><div class="between" style="margin-bottom:10px"><div><h2>${esc(g.n)}</h2><p class="kick">By ${fmt(parse(g.due))} · ${relDay(daysTo(g.due))}</p></div><b class="mid tnum" style="font-size:28px">${Math.round(pc*100)}%</b></div>${prog(pc,g.c)}${nx?`<div class="nextstep" style="--c:${g.c};margin-top:12px"><small>Next tiny step</small><b>${esc(nx.t)}</b></div>`:""}<div style="margin-top:12px">${stepsList("goals",i,g.steps,"steps")}</div></div>`}).join("")}</div>`};

PAGES["learn:courses"]=()=>`<div class="grid"><div class="card c12 flat">${hd("Courses you're doing and the ones you've finished, with what you learnt","Courses & notes",addBtn("courses","Add course"))}</div>${S.x.courses.map((c,i)=>`<div class="card c4">${edBtn("courses",i)}<div class="row" style="gap:8px;margin-bottom:6px"><span class="tag" style="background:${c.c}22;color:${c.c}">${esc(c.st||"Doing")}</span><span class="kick" style="margin:0">${esc(c.where)}</span></div><h2><a class="plink" href="#learn-courses~${i}">${esc(c.n)}</a></h2><div class="between" style="margin:12px 0 8px"><span class="mid tnum">${Math.round(c.done/c.total*100)}%</span>${c.done<c.total?`<button class="btn sm" data-act="lesson:${i}">+1 lesson</button>`:`<span class="tag t-health">Certificate ✓</span>`}</div>${prog(c.done/c.total,c.c)}
 ${c.notes?`<div class="learnt" style="--c:${c.c}"><small>What I learnt</small><ul>${c.notes.split("\n").filter(Boolean).map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`:""}<a class="btn ghost sm" href="#learn-courses~${i}" style="margin-top:12px">${tr("Open page")} →</a></div>`).join("")}</div>`;

PAGES["people:events"]=()=>`<div class="grid"><div class="card c12 flat">${hd("Holidays, weddings and parties. What to prepare and when.","Occasions & holidays",addBtn("events","New occasion"))}</div>${S.x.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(ev=>{const i=S.x.events.indexOf(ev),n=daysTo(ev.date),dn=ev.list.filter(z=>z.d).length;
 return `<div class="card c4 occ">${edBtn("events",i)}<div class="between"><span class="tag" style="background:var(--coral2);color:#C24747">${esc(ev.kind||"Other")}</span><span class="kick" style="margin:0">${fmt(parse(ev.date))}</span></div><div class="row" style="gap:12px;margin:10px 0"><div class="cnum tnum" style="font-size:54px">${Math.max(0,n)}</div><div><h2>${esc(ev.n)}</h2><p class="kick">${n>0?"days to go":n===0?"It's today!":"Done"} · ${dn}/${ev.list.length} ready</p></div></div>${prog(ev.list.length?dn/ev.list.length:0,"#E0565B")}
 <div class="prep">${ev.list.slice().sort((a,b)=>b.b-a.b).map(z=>{const j=ev.list.indexOf(z),when=addD(parse(ev.date),-z.b),late=!z.d&&when<TODAY;return `<div class="pstep ${z.d?"done":""} ${late?"late":""}"><button class="chk" role="checkbox" aria-checked="${!!z.d}" data-act="xs:events:${i}:list:${j}" aria-label="${esc(z.t)}">${I("check",14,3)}</button><div class="grow"><b>${esc(z.t)}</b><span>${z.b?z.b+(z.b==1?" day":" days")+" before · ":"On the day · "}${WD[when.getDay()]} ${fmt(when)}${late?" · do it now":""}</span></div></div>`}).join("")}</div>
 <button class="btn ghost sm" data-act="prep2cal:${i}" style="margin-top:12px;align-self:flex-start">${I("plan",15)} Put steps on my calendar</button></div>`}).join("")}</div>`;

let covOpen=-1;HACT.covedit=([i])=>{covOpen=covOpen===+i?-1:+i};
PAGES["explore:albums"]=()=>`<div class="grid"><div class="card c12 flat">${hd("Each trip becomes a little photo book. Tap one to open it.","Photo books",addBtn("albums","New photo book"))}</div><div class="card c12"><div class="books">${S.x.albums.map((a,i)=>`<div class="bookwrap"><button class="pbook" data-act="openbook:${i}" aria-label="Open ${esc(a.n)}">${coverSVG(a)}<span class="spinel"></span></button><div class="between" style="margin-top:10px"><div style="min-width:0"><b>${esc(a.n)}</b><p class="kick" style="margin:0">${esc(a.country)} · ${a.photos.length} photos</p></div><button class="edbtn covtog" data-act="covedit:${i}" aria-expanded="${covOpen===i}" aria-label="Edit ${esc(a.n)}">${I("edit",15)}</button></div>${covOpen===i?`<div class="covedit"><p class="kick" style="margin:0 0 2px">Cover style</p><div class="covpick" role="group" aria-label="Cover style">${COVERS.map((n,k)=>`<button data-act="cover:${i}:${k}" aria-pressed="${(+a.cover||0)%3===k}">${n}</button>`).join("")}</div><div class="covcols" role="group" aria-label="Cover color"><button data-act="acol:${i}:" aria-pressed="${!a.bg}" class="auto" data-tip="Country color">A</button>${ACOLS.map(([c,t])=>`<button data-act="acol:${i}:${c.slice(1)}:${t.slice(1)}" aria-pressed="${a.bg===c}" style="background:${c}" aria-label="Color ${c}"></button>`).join("")}</div><div class="row" style="gap:6px;margin-top:10px"><button class="btn" style="padding:7px 12px;font-size:13px" data-ce="albums:${i}">Edit name & photos</button><button class="btn ghost" style="padding:7px 12px;font-size:13px" data-act="covedit:${i}">Done</button></div></div>`:""}</div>`).join("")}<button class="bookwrap newbook" data-ce="albums:-1">${I("plus",30,2)}<b>New photo book</b><span class="muted">Pick a country, we make the cover</span></button></div></div></div>`;
let BOOK=null;
const bookMob=()=>innerWidth<=760;
function bookPages(a){return [{cover:1},{endp:1},...a.photos.map((p,k)=>({p,k})),{add:1}]}
function bookSide(a,x,cls){cls=cls||"";if(!x)return `<div class="bpage none ${cls}"></div>`;
 if(x.cover)return `<div class="bpage coverp ${cls}">${coverSVG(a,1)}</div>`;
 if(x.endp)return `<div class="bpage endp ${cls}" style="--bc:${a.bg||cdef(a.country)[0]}"><div class="endpat"></div><div class="endlab"><small>This little book holds</small><b>${esc(a.n)}</b><span>${esc(a.country)}${a.d?" · "+esc(a.d):""}</span><em>${a.photos.length} memories</em></div></div>`;
 if(x.add)return `<div class="bpage addp ${cls}"><label class="btn" style="cursor:pointer">${I("img",16)} Add photos<input type="file" accept="image/*" multiple hidden id="bookIn"></label><p class="muted">They're saved on this device.</p></div>`;
 return `<div class="bpage ${cls}">${photoArt(x.p)}<p class="cap">${esc(x.p.cap||"")}</p><span class="pno">${x.k+1}</span></div>`}
function bookView(a,P,s){if(bookMob())return bookSide(a,P[s]);return bookSide(a,s?P[2*s-1]:null,"L")+bookSide(a,P[2*s],"R")}
function bookMax(P){return bookMob()?P.length-1:Math.ceil((P.length-1)/2)}
function bookLabel(P,s){if(s===0)return "Cover";if(bookMob())return P[s].endp?"Inside cover":P[s].add?"Add photos":"Photo "+(P[s].k+1);const l=P[2*s-1],r=P[2*s];return l&&l.endp?"Inside cover":"Pages "+(2*s-2)+(r&&!r.add?"–"+(2*s-1):"")}
function openBook(i,s){const a=S.x.albums[i];BOOK={i,s:s||0,busy:0};const P=bookPages(a);
 let w=document.getElementById("bookWrap");if(!w){w=document.createElement("div");w.id="bookWrap";document.body.appendChild(w)}
 w.innerHTML=`<div class="sheet-bg" data-act="closebook"></div><div class="bookview" role="dialog" aria-label="${esc(a.n)} photo book"><div class="between" style="color:#fff;margin-bottom:12px"><b style="font-size:18px">${esc(a.n)} · ${esc(a.country)}</b><button class="round" data-act="closebook" aria-label="Close">${I("x",16)}</button></div>
  <div class="book3d"><div class="spread ${BOOK.s===0?"closed":""} ${bookMob()?"mob":""}" id="spread">${bookView(a,P,BOOK.s)}</div></div>
  <div class="row" style="justify-content:center;margin-top:16px"><button class="round" data-act="bookpg:-1" aria-label="Previous page">${I("left",16)}</button><span id="bookLbl" style="color:#fff;font-weight:600;min-width:110px;text-align:center">${bookLabel(P,BOOK.s)}</span><button class="round" data-act="bookpg:1" aria-label="Next page">${I("right",16)}</button></div><p class="booktip">Tap a page or swipe to turn it</p></div>`;
 w.hidden=false;bookBtns(P);hydrate()}
function bookBtns(P){const w=document.getElementById("bookWrap");if(!w)return;const [pv,nx]=w.querySelectorAll('[data-act^="bookpg"]');pv.disabled=BOOK.s===0;nx.disabled=BOOK.s>=bookMax(P)}
function turnBook(d){if(!BOOK||BOOK.busy)return;const a=S.x.albums[BOOK.i],P=bookPages(a),s0=BOOK.s,s1=s0+d;if(s1<0||s1>bookMax(P))return;
 const sp=document.getElementById("spread");if(!sp)return;const mob=bookMob();
 if(matchMedia("(prefers-reduced-motion: reduce)").matches){BOOK.s=s1;sp.innerHTML=bookView(a,P,s1);sp.classList.toggle("closed",s1===0);finish();return}
 BOOK.busy=1;
 let front,back,under;
 if(mob){front=bookSide(a,d>0?P[s0]:P[s1]);back='<div class="bpage paperback"></div>';under=bookSide(a,d>0?P[s1]:P[s0]);
  sp.innerHTML=under;}
 else if(d>0){front=bookSide(a,P[2*s0],"R");back=bookSide(a,P[2*s1-1],"L");sp.innerHTML=bookSide(a,s0?P[2*s0-1]:null,"L")+bookSide(a,P[2*s1],"R")}
 else{front=bookSide(a,P[2*s0-1],"L");back=bookSide(a,P[2*s1],"R");sp.innerHTML=bookSide(a,s1?P[2*s1-1]:null,"L")+bookSide(a,P[2*s0],"R")}
 const leaf=document.createElement("div");const fwd=d>0;
 leaf.className="leaf "+(mob?"full ":"")+(fwd?"fwd":"back");leaf.innerHTML=`<div class="face front">${front}<i class="shade"></i></div><div class="face backf">${back}<i class="shade"></i></div>`;
 if(mob&&!fwd){leaf.className="leaf full fwd done-start"}
 sp.appendChild(leaf);hydrate();
 if(!mob){if(s0===0&&fwd)sp.classList.remove("closed");if(s1===0)sp.classList.add("closed")}
 leaf.getBoundingClientRect();requestAnimationFrame(()=>leaf.classList.add(mob&&!fwd?"unturn":"go"));

/* ---------- backup / restore ---------- */
function b64(blob){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)})}
function doBackup(){const ids=[];const walk=o=>{if(o&&typeof o==="object"){if(o.id&&o.type&&o.size!==undefined)ids.push(o.id);Object.values(o).forEach(walk)}};walk(S.x);
 Promise.all(ids.map(id=>idb("readonly",st=>st.get(id)).then(b=>b?b64(b).then(u=>[id,u]):null))).then(fs=>{S.x.backupAt=iso(TODAY);save();
  save2(new Blob([JSON.stringify({app:"kofvi-adhd-life-planner",at:new Date().toISOString(),state:S,files:Object.fromEntries(fs.filter(Boolean))})],{type:"application/json"}),"life-planner-backup-"+iso(TODAY)+".json").then(()=>{render();toast("Backup saved. Keep it somewhere safe.")})}).catch(()=>toast("Backup failed. Try again."))}
function restore(text){let d;try{d=JSON.parse(text)}catch(e){toast("That file isn't a planner backup");return}if(!d||d.app!=="kofvi-adhd-life-planner"||!d.state){toast("That file isn't a planner backup");return}
 Promise.all(Object.entries(d.files||{}).map(([id,u])=>fetch(u).then(r=>r.blob()).then(b=>idb("readwrite",st=>st.put(b,id))))).then(()=>{S=d.state;save();render();toast("Everything is back. Welcome home.")})}

document.addEventListener("change",e=>{const t=e.target,id=t.id,num=v=>parseFloat(v)||0,tm=v=>v?(+v.split(":")[0])+(+v.split(":")[1])/60:null;
 if(id==="setName"){S.name=t.value.trim()||"Friend"}else if(id==="setCur"){S.cur=t.value}else if(id==="setPay"){S.payday=Math.max(1,Math.min(31,parseInt(t.value)||28))}
 else if(id==="setStart"){S.dayStart=tm(t.value)??7}else if(id==="setEnd"){S.dayEnd=tm(t.value)??22.5}else if(id==="setUnit"){S.unit=t.value}else if(id==="setWater"){S.waterGoal=Math.max(1,parseInt(t.value)||8)}
 else if(id==="photoIn"&&t.files[0]){putFile(t.files[0]).then(m=>{S.photo=m;save();render();toast("Looking good")});return}
 else if(id==="csvIn"&&t.files[0]){t.files[0].text().then(csvIn);return}
 else return;save();render()});
function csvIn(text){const rows=text.split(/\r?\n/).map(r=>r.split(",")).filter(r=>r.length>1);let n=0;
 rows.slice(1).forEach(r=>{const amt=Math.abs(parseFloat(r.find(c=>/^-?\d+(\.\d+)?$/.test(c.trim()))));if(!amt)return;const desc=(r.find(c=>/[a-z]/i.test(c))||"Other").toLowerCase();
  const cat=/tesco|aldi|lidl|grocer|market|sainsbury|carrefour/.test(desc)?"Groceries":/uber|bus|train|fuel|petrol|tfl/.test(desc)?"Transport":/restaurant|cafe|coffee|deliveroo|eat/.test(desc)?"Eating out":/cinema|netflix|spotify|game/.test(desc)?"Fun":"Other";
  let c=S.spent.find(x=>x.c===cat);if(!c){c={c:cat,plan:100,act:0};S.spent.push(c)}c.act+=amt;n++});
 save();render();toast(n?n+" payments sorted into your spending":"No payments found in that file")}

function homeWidgets(){const n=new Date(),y=n.getFullYear(),mo=n.getMonth(),first=new Date(y,mo,1),pad=(first.getDay()+6)%7,len=new Date(y,mo+1,0).getDate();
 const busy=d=>tasksOn(new Date(y,mo,d)).length+S.x.blocks.filter(b=>b.d===iso(new Date(y,mo,d))).length;
 const m=S.x.music[S.x.musicI%Math.max(1,S.x.music.length)];
 const on=!!S.x.spotOn,cc=on?"c4":"c6";
 return `<div class="card ${cc} clockcard hide-low"><p class="kick">Right now</p><div class="aclock" id="aclock">${clockFace()}</div><div class="digital tnum" id="dclock">${dig(n)}</div><p class="kick" style="text-align:center;margin:0">${Math.max(0,Math.round((S.dayEnd-(n.getHours()+n.getMinutes()/60))*10)/10)} hours of awake time left</p></div>
 <div class="card ${cc} flipcal hide-low"><div class="flip"><div class="fliptop">${MONTHS[mo].toUpperCase()}</div><div class="flipnum tnum">${n.getDate()}</div><div class="flipday">${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][n.getDay()]}</div><span class="ring1"></span><span class="ring2"></span></div>
  <div class="minical">${[..."MTWTFSS"].map(c=>`<span class="h">${c}</span>`).join("")}${"<span></span>".repeat(pad)}${[...Array(len)].map((_,i)=>{const k=busy(i+1);return `<a href="#plan" data-act="calday:${iso(new Date(y,mo,i+1))}" class="${i+1===n.getDate()?"td":""} ${k>3?"b2":k?"b1":""}" data-tip="${i+1} ${MON[mo]}: ${k} things planned" style="animation-delay:${i*12}ms">${i+1}</a>`}).join("")}</div></div>
 ${on?`<div class="card c4 spot hide-low" style="--c:${m?m.c:"#1DB954"}"><div class="between"><p class="kick" style="color:#b3b3b3">Focus music · Spotify</p>${addBtn("spotify","Playlist")}</div>
  <div class="vinyl ${S.x.playing?"spin":""}"><span></span></div>
  <div class="between" style="margin-top:12px"><div style="min-width:0"><b style="font-size:18px;color:#fff">${esc(m?m.n:"Add a playlist")}</b><p class="kick" style="margin:0;color:#b3b3b3">Tap play to open it in Spotify</p></div>${m?edBtn("spotify",S.x.musicI%S.x.music.length):""}</div>
  <div class="row" style="justify-content:center;gap:12px;margin-top:12px"><button class="round" data-act="mnext:-1" aria-label="Previous playlist">${I("left",16)}</button>${m?`<a class="playbtn" href="${esc(m.url)}" target="_blank" rel="noopener" data-act="mplay" aria-label="Play ${esc(m.n)} on Spotify">${I("play",24)}</a>`:""}<button class="round" data-act="mnext:1" aria-label="Next playlist">${I("right",16)}</button></div>
  <div class="eq ${S.x.playing?"on":""}">${[...Array(18)].map((_,i)=>`<i style="animation-delay:${(i*137)%900}ms"></i>`).join("")}</div></div>`:""}`}
function clockFace(){return `<svg viewBox="0 0 200 200" role="img" aria-label="Clock"><circle cx="100" cy="100" r="94" fill="var(--card2)"/><circle cx="100" cy="100" r="94" fill="none" stroke="var(--line)" stroke-width="2"/>
 ${[...Array(60)].map((_,i)=>{const a=i*6*Math.PI/180,r1=i%5?84:78;return `<line x1="${100+Math.sin(a)*r1}" y1="${100-Math.cos(a)*r1}" x2="${100+Math.sin(a)*88}" y2="${100-Math.cos(a)*88}" stroke="${i%5?"var(--faint)":"var(--ink)"}" stroke-width="${i%5?1.2:3}" stroke-linecap="round"/>`}).join("")}
 ${(()=>{const s=S.dayStart,e=S.dayEnd,arc=(h0,h1,r,c,w)=>{const a0=(h0%12)*30*Math.PI/180,a1=(h1%12)*30*Math.PI/180,big=((h1-h0)%12)*30>180?1:0;return `<path d="M${100+Math.sin(a0)*r} ${100-Math.cos(a0)*r} A${r} ${r} 0 ${big} 1 ${100+Math.sin(a1)*r} ${100-Math.cos(a1)*r}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity=".85"/>`};const h=new Date().getHours();return h<12?arc(Math.max(s,0),Math.min(12,e),66,"#FFD12E",8):arc(Math.max(12,s),Math.min(e,23.99),66,"#7B3FE4",8)})()}
 <g id="hH"><line x1="100" y1="108" x2="100" y2="52" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/></g><g id="hM"><line x1="100" y1="112" x2="100" y2="30" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/></g><g id="hS"><line x1="100" y1="118" x2="100" y2="24" stroke="#F2850F" stroke-width="2" stroke-linecap="round"/><circle cx="100" cy="24" r="4" fill="#F2850F"/></g><circle cx="100" cy="100" r="7" fill="#F2850F" stroke="var(--card)" stroke-width="3"/></svg>`}
function tickClock(){const c=document.getElementById("aclock");if(!c)return;const n=new Date(),s=n.getSeconds()+n.getMilliseconds()/1000,m=n.getMinutes()+s/60,h=(n.getHours()%12)+m/60;
 const set=(id,deg)=>{const g=c.querySelector("#"+id);if(g)g.setAttribute("transform",`rotate(${deg} 100 100)`)};set("hS",s*6);set("hM",m*6);set("hH",h*30);
 const d=document.getElementById("dclock");if(d){const v=dig(n);if(d.innerHTML!==v)d.innerHTML=v}}
function dig(n){return ((n.getHours()%12)||12)+"<i>:</i>"+String(n.getMinutes()).padStart(2,"0")+`<small>${n.getHours()<12?"AM":"PM"}</small>`}
(function loop(){tickClock();requestAnimationFrame(loop)})();

 else if(m=/\bevery ((?:(?:mon|tue|wed|thu|fri|sat|sun)(?:day|sday|nesday|rsday|urday)?\b(?:,? (?:and )?)?)+)/.exec(L)){const ds=[...m[1].matchAll(/(mon|tue|wed|thu|fri|sat|sun)/g)].map(x=>WDS.indexOf(x[1]));if(ds.length===1){p.rec="weekly";p.date=iso(nextWd(ds[0]))}else{p.rec="days";p.days=ds.join(",");p.date=iso(TODAY)}cut(/\bevery ((?:(?:mon|tue|wed|thu|fri|sat|sun)(?:day|sday|nesday|rsday|urday)?\b(?:,? (?:and )?)?)+)/i)}
 else if(/\b(every week|weekly)\b/.test(L)){p.rec="weekly";cut(/\b(every week|weekly)\b/i)}

 if(!p.date&&(m=/\b(\d{1,2})(?:st|nd|rd|th)?(?: of)? (jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\w*\b/.exec(L))){p.date=futureDate(+m[1],MONS.indexOf(m[2]));cut(new RegExp("\\b"+m[1]+"(st|nd|rd|th)?( of)? "+m[2]+"\\w*\\b","i"))}
 else if(!p.date&&(m=/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\w* (\d{1,2})(?:st|nd|rd|th)?\b/.exec(L))){p.date=futureDate(+m[2],MONS.indexOf(m[1]));cut(new RegExp("\\b"+m[1]+"\\w* "+m[2]+"(st|nd|rd|th)?\\b","i"))}

/* ===== Celebrate ANY completion (Sara 2026-11-11): confetti + a little card ===== */
function doneKeys(){const K=new Map(),td=iso(TODAY),all=(L)=>Array.isArray(L)&&L.length>0&&L.every(z=>z&&z.d);
 const add=(k,t,s)=>K.set(k,[t,s]);const X=S.x||{};
 try{(X.courses||[]).forEach(c=>{if(c.total&&c.done>=c.total)add("c:"+c.n,"Course finished!",c.n+" is on your certificate wall")})}catch(e){}
 try{(X.books||[]).forEach(b=>{if(b.st==="Done")add("b:"+b.t,"Book finished!",b.t+" joins your finished shelf")})}catch(e){}
 try{(X.goals||[]).forEach(g=>{if(all(g.steps))add("g:"+g.n,"Goal reached!",g.n)})}catch(e){}
 try{(X.projects||[]).forEach(p=>{if(all(p.steps))add("p:"+p.n,"Project done!",p.n)})}catch(e){}
 try{(X.events||[]).forEach(v=>{if(all(v.list))add("e:"+v.n,"All set!",v.n+" is ready")})}catch(e){}
 try{if(all(X.packing))add("pack","All packed!","Every item is ticked. Have a great trip")}catch(e){}
 try{if(all(X.prep))add("prep:"+td,"Meal prep done!","Future you will thank you")}catch(e){}
 try{const R=X.routines||{};if(all(R.morning))add("rm:"+td,"Morning routine done!","What a gentle start");if(all(R.evening))add("re:"+td,"Evening routine done!","Time to rest")}catch(e){}
 try{const di=(TODAY.getDay()+6)%7,H=S.habits||[];H.forEach(h=>{if(h.d&&h.d.length===7&&h.d.every(Boolean))add("hw:"+h.n+":"+td,"Habit week complete!",h.n+", every day this week")});if(H.length&&H.every(h=>h.d&&h.d[di]))add("ht:"+td,"All habits done today!","Every habit ticked for today")}catch(e){}
 try{const L=tasksOn(TODAY);if(L.length&&L.every(t=>isDone(t,TODAY)))add("t:"+td,"Today's list is done!","Every task for today is finished")}catch(e){}
 try{const has=a=>(a||[]).some(z=>z.d===td);if(has(X.sleep)&&has(X.spendlog)&&has(X.grat)&&has(X.journal)&&has(X.movelog))add("ci:"+td,"Daily check-in complete!","All five done today")}catch(e){}
 try{if(S.waterGoal&&S.water>=S.waterGoal)add("w:"+td,"Water goal reached!",S.water+" glasses today")}catch(e){}
 try{(S.jars||[]).forEach(j=>{if(j.done)K.set("j:"+j.n,null)})}catch(e){} /* jars have their own party */
 return K}
let CEL_PREV=null;
function celCheck(){let K;try{K=doneKeys()}catch(e){return}if(CEL_PREV===null){CEL_PREV=K;return}
 const fresh=[...K].filter(([k,v])=>v&&!CEL_PREV.has(k));CEL_PREV=K;if(fresh.length)celebrate(fresh[0][1][0],fresh[0][1][1])}
function celebrate(title,sub){const calm=document.body.classList.contains("calm")||matchMedia("(prefers-reduced-motion: reduce)").matches;
 document.querySelectorAll(".celw").forEach(n=>n.remove());const w=document.createElement("div");w.className="celw";w.setAttribute("role","status");
 let bits="";if(!calm){const cols=["#3E95E0","#FFD12E","#FF6FA8","#5BD08A","#8E6CF0","#FF9F43","#19C3EE"];for(let i=0;i<110;i++){const l=Math.random()*100,d=Math.random()*.5,t=1.6+Math.random()*1.4,x=(Math.random()-.5)*240,r=Math.random()*900-450,s=6+Math.random()*7;bits+=`<i style="left:${l}%;--x:${x}px;--r:${r}deg;width:${s}px;height:${s*(Math.random()<.5?.45:1)}px;background:${cols[i%cols.length]};border-radius:${Math.random()<.3?"50%":"2px"};animation-delay:${d}s;animation-duration:${t}s"></i>`}}
 w.innerHTML=`<div class="celbits" aria-hidden="true">${bits}</div><div class="celcard"><span class="celic" aria-hidden="true">🎉</span><b>${esc(title)}</b>${sub?`<small>${esc(sub)}</small>`:""}<button class="btn" data-celx>Yay!</button></div>`;
 document.body.appendChild(w);const kill=()=>{w.classList.add("out");setTimeout(()=>w.remove(),400)};w.querySelector("[data-celx]").onclick=kill;w.addEventListener("click",e=>{if(e.target===w)kill()});setTimeout(kill,4200)}
{const _r=render;render=function(){_r.apply(this,arguments);setTimeout(celCheck,30)}}
["click","change","submit"].forEach(ev=>document.addEventListener(ev,()=>setTimeout(celCheck,120),true));
setTimeout(()=>{if(CEL_PREV===null)try{CEL_PREV=doneKeys()}catch(e){}},50);

setTimeout(()=>{try{if(!window.__KC&&!S.x.welcomed&&!S.x.frDone&&(location.hash||"#home")==="#home"&&!document.querySelector("#frWrap:not([hidden]) .frbox"))wlOpen()}catch(e){}},700);

/* ===== Kofvi account (kofvi.com/planner/adhd/ only): sign in, Etsy code unlock, sync, file sync, offline, install, notifications.
   Inert in the preview: no KOFVI_CONFIG / supabase -> demo mode, exactly as before. Same pattern as the Book Tracker. ===== */
const KPRODUCT="adhd-planner",KBUCKET="planner-files";
const KCFG=window.KOFVI_CONFIG||{};
const KCLOUD=!!(KCFG.supabaseUrl&&KCFG.supabaseKey&&window.supabase)&&!/[?&]demo\b/.test(location.search);
window.__KC=KCLOUD;let KSB=null,KUSER=null,KGRANT=false,KPULL=false,KPT=null,KSYNC="";

/* A brand-new buyer starts with an empty planner (the demo keeps Alex's sample data). */
function kBlank(){const keep={look:S.look,cur:S.cur,lang:S.lang};
 S.name="Friend";S.photo=null;S.tasks=[];S.brain=[];S.bills=[];S.jars=[];S.debts=[];S.doneOcc={};S.habits=[];S.meds=[];
 S.spent=[{c:"Groceries",plan:0,act:0},{c:"Eating out",plan:0,act:0},{c:"Transport",plan:0,act:0},{c:"Fun",plan:0,act:0}];
 S.income=0;S.water=0;S.mood=3;S.energy=3;S.moodLog=S.moodLog.map(()=>0);S.energyLog=S.energyLog.map(()=>0);S.weights=S.weights.map(()=>0);S.workouts=[];
 if(S.meals){S.meals.plan=S.meals.plan.map(()=>["","",""]);S.meals.got={}}
 if(S.body)Object.keys(S.body).forEach(k=>{if(!/Goal$|^h$/.test(k))S.body[k]=0});
 const X=S.x;Object.keys(X).forEach(k=>{if(Array.isArray(X[k])&&!/^(spOrder|hubOrder|areas|dopa|music)$/.test(k))X[k]=[]});
 X.blocks=[];X.routines={morning:[],evening:[]};X.chores={people:["Me"],list:[]};X.tt={days:["Mon","Tue","Wed","Thu","Fri"],slots:["9:00","11:00","14:00"],cells:{}};
 X.hist={};X.bvoice=[];X.focusMin=0;X.breaks=0;X.nDis={};X.remFired={};X.backupAt=null;X.welcomed=0;X.frDone=0;X.frSkip=0;
 S.calSeed=1;X.evSeed=X.goalSeed=X.courseSeed=1;Object.assign(S,keep);S._acct=1}

/* ---- sync ---- */
function kSet(st){KSYNC=st;const el=document.getElementById("kAcct");if(el)el.outerHTML=kAcctLine()}
function kAcctLine(){if(!KCLOUD||!KUSER)return"";const t={saving:"Saving…",synced:"Saved to your account",offline:"Offline. Saved on this device",error:"Couldn't save. Trying again soon"}[KSYNC]||"Saved to your account";
 return `<a id="kAcct" class="kacct ${KSYNC}" href="#settings"><i></i><span>${t}</span></a>`}
window.__kofviPush=function(){if(!KCLOUD||!KSB||!KUSER||KPULL||!KGRANT)return;kSet("saving");clearTimeout(KPT);
 KPT=setTimeout(async()=>{try{const t=new Date().toISOString();S._t=Date.parse(t);S._uid=KUSER.id;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  const {error}=await KSB.from("planners").upsert({user_id:KUSER.id,product:KPRODUCT,data:S,updated_at:t},{onConflict:"user_id,product"});
  kSet(error?(navigator.onLine?"error":"offline"):"synced");if(error&&navigator.onLine)setTimeout(window.__kofviPush,15000)}catch(e){kSet(navigator.onLine?"error":"offline")}KPT=null},1500)};
function kReplace(d){Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,d);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
async function kPull(){if(!KSB||!KUSER||!KGRANT)return;KPULL=true;
 try{const {data,error}=await KSB.from("planners").select("data,updated_at").eq("user_id",KUSER.id).eq("product",KPRODUCT).maybeSingle();
  if(error){kSet(navigator.onLine?"error":"offline");return}
  if(data&&data.data&&data.data.v){const rt=Date.parse(data.updated_at);if(S._uid!==KUSER.id||!(S._t>rt)){const d=data.data;d._t=rt;d._uid=KUSER.id;kReplace(d)}else{KPULL=false;window.__kofviPush()}}
  else{if(S._uid&&S._uid!==KUSER.id)kBlank();S._uid=KUSER.id;KPULL=false;window.__kofviPush()}
  kSet("synced")}finally{KPULL=false}}

/* ---- files (photos, voice notes, certificates): IndexedDB on the device + a private copy in the account ---- */
const KQ="kofvi-adhd-upq";
const kQueue=()=>{try{return JSON.parse(localStorage.getItem(KQ)||"[]")}catch(e){return[]}},kQSet=q=>{try{localStorage.setItem(KQ,JSON.stringify(q))}catch(e){}};
async function kUpload(id){if(!KSB||!KUSER||!KGRANT)return false;const b=await idb("readonly",st=>st.get(id));if(!b)return true;
 const {error}=await KSB.storage.from(KBUCKET).upload(KUSER.id+"/"+id,b,{upsert:true,contentType:b.type||"application/octet-stream"});return !error}
async function kFlush(){const q=kQueue();if(!q.length)return;const left=[];for(const id of q){try{if(!(await kUpload(id)))left.push(id)}catch(e){left.push(id)}}kQSet(left)}
if(KCLOUD){
 const _pf=putFile;putFile=function(file){return _pf(file).then(r=>{const q=kQueue();q.push(r.id);kQSet(q);kFlush();return r})};
 const _fu=fileURL;fileURL=function(id){return _fu(id).then(u=>{if(u||!KSB||!KUSER||!/^f/.test(id))return u;
  return KSB.storage.from(KBUCKET).download(KUSER.id+"/"+id).then(({data})=>data?idb("readwrite",st=>st.put(data,id)).then(()=>URLS[id]=URL.createObjectURL(data)):null).catch(()=>null)})};
}

/* ---- sign-in and unlock gate ---- */
function kGate(html){let g=document.getElementById("kGate");if(!g){g=document.createElement("div");g.id="kGate";document.body.appendChild(g)}
 g.innerHTML=`<div class="frbg"></div><div class="frbox kbox" role="dialog" aria-modal="true" aria-label="Kofvi account"><div class="kbrand"><span class="kk">k</span><b>Kofvi</b><small>ADHD Life Planner</small></div>${html}</div>`;g.hidden=false;
 setTimeout(()=>{const f=g.querySelector("input");f&&f.focus()},50)}
function kUngate(){const g=document.getElementById("kGate");if(g){g.hidden=true;g.innerHTML=""}}
function kLogin(msg){kGate(`<h2>Sign in to your planner</h2><p>Everything is saved to your own private account, so it's the same on your phone and your computer. No password: we email you a sign-in link.</p>
 <form id="kLoginF" class="kform"><label class="field">Email<input id="kEmail" type="email" required autocomplete="email" placeholder="you@example.com"></label>
 <label class="field">Access code <small>first time only, it's in your Etsy download</small><input id="kCode" autocomplete="off" placeholder="e.g. KOFVI-ADHD-XXXX"></label>
 <button class="btn" type="submit" id="kBtn">Email me a sign-in link</button><div id="kMsg">${msg?`<p class="kerr">${esc(msg)}</p>`:""}</div></form>
 <p class="kfoot">Just looking? <a href="?demo">Try the demo</a>, no sign-in needed · <a href="/planner/">All Kofvi planners</a></p>`)}
function kUnlock(msg){kGate(`<h2>Unlock your planner</h2><p>You're signed in as <b>${esc(KUSER.email||"")}</b>, but the ADHD Life Planner isn't on your account yet. Enter the access code from your Etsy download.</p>
 <form id="kUnlockF" class="kform"><label class="field">Access code<input id="kUCode" required autocomplete="off" placeholder="e.g. KOFVI-ADHD-XXXX"></label><button class="btn" type="submit" id="kUBtn">Unlock</button>${msg?`<p class="kerr">${esc(msg)}</p>`:""}</form>
 <p class="kfoot"><a href="?demo">Try the demo</a> · <a href="/planner/">All Kofvi planners</a> · <button type="button" class="wlskip" data-kact="signout">Sign out</button></p>`)}
async function kDoLogin(){const email=document.getElementById("kEmail").value.trim(),code=document.getElementById("kCode").value.trim(),out=document.getElementById("kMsg"),btn=document.getElementById("kBtn");if(!email)return;btn.disabled=true;btn.textContent="Sending…";
 const fail=t=>{out.innerHTML=`<p class="kerr">${esc(t)}</p>`;btn.disabled=false;btn.textContent="Email me a sign-in link"};
 try{if(code){const {data:prod,error}=await KSB.rpc("code_product",{p_code:code});if(error)return fail("We couldn't check the code. Check your connection and try again.");if(!prod)return fail("That access code isn't right. Copy it exactly as it appears in your Etsy download.");if(prod!==KPRODUCT)return fail("This code is for a different Kofvi planner. Open that planner from kofvi.com/planner.");try{localStorage.setItem("kofvi-pending-code",code)}catch(e){}}
  const {error}=await KSB.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:!!code,data:code?{access_code:code}:undefined}});
  if(error){if(/signups not allowed|not found|otp_disabled/i.test(error.message))return fail("We don't have an account for this email yet. If you're new, add the access code from your Etsy download.");if(/rate|seconds/i.test(error.message))return fail("Please wait a minute before asking for another link.");return fail(error.message)}
  out.innerHTML=`<p class="kok">Check your inbox. We sent a sign-in link to <b>${esc(email)}</b>. Open it on this device.</p>`;btn.textContent="Link sent"}catch(e){fail("Something went wrong. Check your connection and try again.")}}
async function kHas(){try{const pc=localStorage.getItem("kofvi-pending-code");if(pc){await KSB.rpc("redeem_access_code",{p_code:pc});localStorage.removeItem("kofvi-pending-code")}}catch(e){}
 const {data,error}=await KSB.from("user_products").select("product").eq("user_id",KUSER.id).eq("product",KPRODUCT).maybeSingle();if(error)return null;return !!data}
async function kDoUnlock(){const code=document.getElementById("kUCode").value.trim(),btn=document.getElementById("kUBtn");if(!code)return;btn.disabled=true;btn.textContent="Checking…";
 const {data:prod}=await KSB.rpc("code_product",{p_code:code});if(prod&&prod!==KPRODUCT)return kUnlock("This code is for a different Kofvi planner. Open that planner from kofvi.com/planner.");
 const {data,error}=await KSB.rpc("redeem_access_code",{p_code:code});if(error||data!==KPRODUCT)return kUnlock(error?"We couldn't check the code. Check your connection and try again.":"That access code isn't right. Copy it exactly as it appears in your Etsy download.");await kOpen()}
async function kOpen(){const ok=await kHas();if(ok===null){if(S._uid===KUSER.id){KGRANT=true;kUngate();kSet("offline");render();return}kLogin("We couldn't reach your account. Check your connection and refresh.");return}
 if(!ok){KGRANT=false;kUnlock();return}KGRANT=true;await kPull();if(/[?&]code=/.test(location.search))history.replaceState(null,"",location.pathname+location.hash);
 kUngate();kSet("synced");kFlush();render();try{cleanUndoReset()}catch(e){}setTimeout(()=>{try{if(!S.x.welcomed&&!S.x.frDone&&!document.querySelector("#frWrap:not([hidden]) .frbox"))wlOpen()}catch(e){}},400)}
async function kBoot(){KSB=window.supabase.createClient(KCFG.supabaseUrl,KCFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
 let ses=null;try{ses=(await KSB.auth.getSession()).data.session}catch(e){}
 if(!ses){if(!navigator.onLine&&S._uid){KUSER={id:S._uid,email:""};KGRANT=true;kUngate();kSet("offline");return}kLogin(/error_description=([^&]+)/.test(location.href)?decodeURIComponent(RegExp.$1.replace(/\+/g," ")):"")}else{KUSER=ses.user;await kOpen()}
 KSB.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_IN"&&s&&(!KUSER||KUSER.id!==s.user.id)){KUSER=s.user;kOpen()}if(ev==="SIGNED_OUT"){KUSER=null;KGRANT=false;kLogin()}});
 addEventListener("focus",()=>{if(KUSER&&KGRANT&&!KPT&&!document.querySelector(".sheet-bg,#frWrap:not([hidden]) .frbox,.bkov"))kPull().then(()=>render())});
 addEventListener("online",()=>{if(KUSER){window.__kofviPush();kFlush()}})}
document.addEventListener("submit",e=>{if(e.target.id==="kLoginF"){e.preventDefault();kDoLogin()}else if(e.target.id==="kUnlockF"){e.preventDefault();kDoUnlock()}},true);
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-kact]");if(!t)return;const a=t.dataset.kact;
 if(a==="signout"&&KSB){if(confirm("Sign out on this device? Your planner stays safe in your account.")){KSB.auth.signOut();try{localStorage.removeItem(KEY)}catch(e){}}}
 else if(a==="install")kInstall();else if(a==="notify")kNotifyOn()});

const kStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;

 kGate(`<h2>Add it to your Home Screen</h2><p>Then it opens like an app, works offline, and can send you reminders.</p>${kIOS()?`<ol class="ksteps"><li>Open <b>kofvi.com/planner/adhd</b> in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (the square with an arrow).</li><li>Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.</li><li>Open the planner from the new icon, then turn on reminders in Settings.</li></ol>`:`<ol class="ksteps"><li>Open <b>kofvi.com/planner/adhd</b> in <b>Chrome</b> or <b>Edge</b>.</li><li>Tap the <b>⋮</b> menu (top right).</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li><li>Open it from the new icon.</li></ol>`}<button class="btn" data-kact="closegate" onclick="document.getElementById('kGate').hidden=true">Got it</button>`)}

function kNotifyOn(){if(kIOS()&&!kStandalone()){kInstall();return}if(!("Notification" in window)){toast("This browser can't show notifications. You'll still see nudges in the app.");return}
 Notification.requestPermission().then(p=>{toast(p==="granted"?"Reminders are on":"No problem. You'll still see nudges in the app.");if(p==="granted"){S.x.rem=S.x.rem||{};S.x.rem.on=1;save()}render()})}
{const _n=nudge;nudge=function(t,s){if(S.x.rem&&"Notification" in window&&Notification.permission==="granted"&&document.hidden&&navigator.serviceWorker&&navigator.serviceWorker.controller){navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:s,icon:"icon-192.png",badge:"icon-192.png",tag:t})).catch(()=>{})}else _n(t,s)}}

/* ---- account card in Settings, status line in the menu ---- */

 return `<div class="card c12 kcard"><div class="head"><div><p class="kick">Your Kofvi account</p><h2>${KUSER&&KUSER.email?esc(KUSER.email):"Signed in"}</h2></div><div class="row">${kAcctLine()}</div></div>
 <div class="krow"><div><b>${kStandalone()?"Installed on this device":"Add to your Home Screen"}</b><small>${kStandalone()?"It opens like an app and works offline.":"Opens like an app, works offline, and can send reminders."}</small></div>${kStandalone()?"":`<button class="btn" data-kact="install">Show me how</button>`}</div>
 <div class="krow"><div><b>Phone reminders</b><small>${perm==="granted"?"On. Change which ones under Gentle reminders.":perm==="denied"?"Blocked in your browser settings for kofvi.com.":"Meds, water, bills and tasks, with quiet hours."}</small></div>${perm==="granted"||perm==="denied"?"":`<button class="btn ghost" data-kact="notify">Turn on</button>`}</div>
 <div class="krow"><div><b>Sign out</b><small>Your planner stays safe in your account.</small></div><button class="btn ghost" data-kact="signout">Sign out</button></div></div>`}
if(KCLOUD){
 {const _vs=viewSettings;viewSettings=function(){const h=_vs();const i=h.indexOf('<div class="card');return i>=0?h.slice(0,i)+kAccountCard()+h.slice(i):kAccountCard()+h}}
 {const _sh=sideHTML;sideHTML=function(){return _sh()+kAcctLine()}}
 if(!S._acct&&!S._uid)kBlank();

}

/* Empty planners divide by zero in a few places: show 0 instead of "NaN". */
function kNoNaN(){const m=document.getElementById("main");if(!m)return;const w=document.createTreeWalker(m,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(/NaN|Infinity/.test(n.nodeValue))n.nodeValue=n.nodeValue.replace(/-?Infinity|NaN/g,"0")}}
{const _r=render;render=function(){_r.apply(this,arguments);try{kNoNaN()}catch(e){}}}

Object.assign(P,{moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'});

 document.querySelectorAll("#side .srow[href], #side .ssubs a[href]").forEach(a=>{const k=(a.getAttribute("href")||"").slice(1).split("-")[0];const i=a.querySelector("i");const im=stkImg(k);if(i&&im&&!i.querySelector("img"))i.innerHTML=im});
 document.querySelectorAll(".mbar button[data-go]").forEach(b=>{const im=stkImg(b.dataset.go),sv=b.querySelector("svg");if(im&&sv)sv.outerHTML=im});
 document.querySelectorAll(".spacecard .hubic").forEach(h=>{const a=h.closest("a");const k=a&&(a.getAttribute("href")||"").slice(1).split("-")[0];const im=stkImg(k);if(im)h.innerHTML=im});
}}

/* start-up changes (sample data top-ups) are not the user's edits: clear them from Undo */
function cleanUndoReset(){try{UNDO.length=0;REDO.length=0;lastJ=JSON.stringify(S);lastK=uiK(S);const u=document.getElementById("undoPill");if(u)u.classList.remove("on")}catch(e){}}
cleanUndoReset();setTimeout(cleanUndoReset,0);setTimeout(cleanUndoReset,400);

readHash();
/* edit layout: reorder and hide sections per page */
let editing=false,dragId=null;
const LK=()=>view+(sub?":"+sub:"");const lay=()=>{S.layout=S.layout||{};S.layout[LK()]=S.layout[LK()]||{order:[],hidden:[]};return S.layout[LK()]};
function secs(){const g=document.querySelector("main .grid");return g?[...g.children]:[]}
function orderedIds(){return secs().slice().sort((a,b)=>(+a.style.order)-(+b.style.order)).map(x=>x.dataset.sec)}
function applyLayout(){
  const L=lay(),els=secs();
  els.forEach((el,i)=>{el.dataset.sec="s"+i;const k=L.order.indexOf("s"+i);el.style.order=k<0?100+i:k;el.classList.toggle("is-hidden",L.hidden.includes("s"+i));
    el.querySelector(":scope>.edbar")?.remove();
    if(editing){el.draggable=true;const t=(el.querySelector(".kicker,.kick,h2,.notehead b")||{}).textContent||"Card";const hid=L.hidden.includes("s"+i);
      el.insertAdjacentHTML("afterbegin",`<div class="edbar"><span>⠿ ${esc(t.trim().slice(0,22))}</span><button data-ed="up:${el.dataset.sec}" aria-label="Move earlier">↑</button><button data-ed="down:${el.dataset.sec}" aria-label="Move later">↓</button><button data-ed="hide:${el.dataset.sec}">${hid?"Show":"Hide"}</button></div>`)}else el.draggable=false});
  const pills=document.querySelector("main .hello .pills")||(()=>{const h=document.querySelector("main .hello");if(!h)return null;h.insertAdjacentHTML("beforeend",'<div class="pills"></div>');return h.querySelector(".pills")})();
  if(pills&&!pills.querySelector(".edit-btn"))pills.insertAdjacentHTML("beforeend",(editing?`<button class="pill edit-btn" data-ed="toggle" aria-pressed="true">${I("check",16)} Done</button>`:`<span class="custw edit-btn"><button class="pill" data-cust aria-expanded="false" aria-haspopup="menu">${I("edit",16)} Customize</button><span class="custm" role="menu" hidden><button role="menuitem" data-ed="toggle"><b>Move or hide cards</b><small>Change the order of the cards on this page, or hide ones you don't need.</small></button><button role="menuitem" data-act="tour"><b>Take the tour</b><small>A 20-second walk through this page.</small></button><button role="menuitem" data-act="topages"><b>Show or hide pages</b><small>Put away whole pages you don't use. Bring them back any time in Settings.</small></button></span></span>`));
  const hello=document.querySelector("main .hello");
  if(hello&&!document.querySelector(".edbanner"))(document.querySelector("main .subtabs")||document.querySelector("main .nag")||hello).insertAdjacentHTML("afterend",`<div class="edbanner"><p><b>Arrange this page.</b> Drag cards, or use the arrows. Hidden cards stay here, faded, so you can show them again.</p><button class="btn ghost" data-ed="reset">Reset</button><button class="btn" data-ed="toggle">Done</button></div>`);
  document.body.classList.toggle("editing",editing);
}
function saveOrder(ids){lay().order=ids;save();applyLayout()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-ed]");if(!b)return;e.stopPropagation();const [a,id]=b.dataset.ed.split(":");
  if(a==="toggle"){editing=!editing;render();return}
  if(a==="reset"){S.layout[LK()]={order:[],hidden:[]};save();render();return}
  const ids=orderedIds(),i=ids.indexOf(id);
  if(a==="up"&&i>0){[ids[i-1],ids[i]]=[ids[i],ids[i-1]];saveOrder(ids)}
  if(a==="down"&&i<ids.length-1){[ids[i+1],ids[i]]=[ids[i],ids[i+1]];saveOrder(ids)}
  if(a==="hide"){const L=lay();L.hidden=L.hidden.includes(id)?L.hidden.filter(x=>x!==id):[...L.hidden,id];save();applyLayout()}
},true);
document.addEventListener("dragstart",e=>{const el=e.target.closest&&e.target.closest("main .grid>[data-sec]");if(!editing||!el)return;dragId=el.dataset.sec;el.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
document.addEventListener("dragover",e=>{const el=e.target.closest&&e.target.closest("main .grid>[data-sec]");if(!editing||!dragId||!el)return;e.preventDefault();secs().forEach(x=>x.classList.remove("drop-before","drop-after"));if(el.dataset.sec!==dragId){const r=el.getBoundingClientRect();el.classList.add(e.clientX<r.left+r.width/2?"drop-before":"drop-after")}});
document.addEventListener("drop",e=>{const el=e.target.closest&&e.target.closest("main .grid>[data-sec]");if(!editing||!dragId||!el)return;e.preventDefault();const before=el.classList.contains("drop-before");const ids=orderedIds().filter(x=>x!==dragId);let j=ids.indexOf(el.dataset.sec);if(!before)j++;ids.splice(j,0,dragId);secs().forEach(x=>x.classList.remove("drop-before","drop-after","dragging"));dragId=null;saveOrder(ids)});
document.addEventListener("dragend",()=>{secs().forEach(x=>x.classList.remove("drop-before","drop-after","dragging"));dragId=null});

/* hover values */
const tip=document.getElementById("tip");let tipEl=null;
function showTip(el,x,y){tip.textContent=el.getAttribute("data-tip");tip.classList.add("on");const r=tip.getBoundingClientRect();let L=x+14,T=y-r.height-12;if(L+r.width>innerWidth-8)L=x-r.width-14;if(T<8)T=y+18;tip.style.left=Math.max(8,L)+"px";tip.style.top=T+"px"}
document.addEventListener("pointermove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el&&e.pointerType==="mouse"&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){tipEl=el;showTip(el,e.clientX,e.clientY)}else if(tip.classList.contains("on")){tipEl=null;tip.classList.remove("on")}});
const tipOff=()=>{tipEl=null;tip.classList.remove("on")};["scroll","focusin","keydown","wheel"].forEach(ev=>addEventListener(ev,tipOff,{capture:true,passive:true}));document.documentElement.addEventListener("pointerleave",tipOff);document.addEventListener("click",()=>setTimeout(()=>{if(tipEl&&!tipEl.isConnected)tipOff()},0),true);
document.addEventListener("pointerdown",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el&&e.pointerType!=="mouse"){showTip(el,e.clientX,e.clientY);clearTimeout(showTip.t);showTip.t=setTimeout(()=>tip.classList.remove("on"),1800)}});
addEventListener("scroll",()=>tip.classList.remove("on"),{passive:true});
render();
})();
